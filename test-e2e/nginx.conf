# simple-directory requires x-forwarded-* headers and refuses requests without
# them (see reqOrigin/reqIp in @data-fair/lib-express), so the e2e stack puts a
# reverse proxy in front exactly as a real deployment does.
server {
  listen 8080;
  server_name _;

  location / {
    proxy_pass http://simple-directory:8080;
    proxy_set_header Host              $http_host;
    # the port matters: it becomes part of the origin, which is the audience
    # the NHI assertion must carry
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }
}

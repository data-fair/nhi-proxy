# Self-contained simple-directory stack for the end-to-end test.
#
# Deliberately isolated: its own compose project name, an in-memory database and
# unusual host ports, so it never collides with a data-fair dev stack you may
# already be running. Bring it up with `npm run e2e-stack`.
name: nhi-proxy-e2e

services:
  mongo:
    image: mongo:7
    ports: ['27317:27017']
    # ephemeral on purpose: every run starts from an empty database
    tmpfs: ['/data/db']

  simple-directory:
    # :master, not a release tag — NHI support is merged on master but not yet
    # in a published release
    image: ghcr.io/data-fair/simple-directory:master
    depends_on: [mongo]
    environment:
      PORT: 8080
      PUBLIC_URL: http://localhost:5690/simple-directory
      MONGO_URL: mongodb://mongo:27017/nhi-proxy-e2e
      # the whole point: without this every exchange returns 404
      MANAGE_NHIS: 'true'
      ADMINS: '["superadmin@test.com"]'
      OBSERVER_ACTIVE: 'false'
      CONTACT: e2e@example.com
      # throwaway: this stack is ephemeral and never leaves the machine
      CIPHER_PASSWORD: nhi-proxy-e2e
      # The auth limiter spends a point on every exchange, successful or not
      # (5/minute by default), which repeated test runs exhaust. Raised so a
      # re-run is not gated on the previous one's bucket — note this makes the
      # limiter unobservable here, so the e2e test asserts the exchange count
      # directly rather than waiting for a 429.
      AUTHRATELIMIT_ATTEMPTS: '1000'
      AUTHRATELIMIT_DURATION: '60'

  nginx:
    image: nginx:1-alpine
    depends_on: [simple-directory]
    ports: ['5690:8080']
    volumes:
      - ./test-e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
